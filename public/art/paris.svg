<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid slice">
<style>
.tw{animation:tw 2.4s ease-in-out infinite}.tw:nth-child(2n){animation-delay:.8s}.tw:nth-child(3n){animation-delay:1.5s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.cl{animation:dr 40s linear infinite}@keyframes dr{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.beam{transform-origin:400px 62px;animation:sw 6s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
.win{animation:tw 3s ease-in-out infinite}
</style>
<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0a2a"/><stop offset="1" stop-color="#5a2a5a"/></linearGradient></defs>
<rect width="800" height="220" fill="url(#s)"/>
<g fill="#fff"><circle class="tw" cx="60" cy="30" r="1.5"/><circle class="tw" cx="150" cy="60" r="1.5"/><circle class="tw" cx="240" cy="22" r="1.5"/><circle class="tw" cx="330" cy="48" r="1.5"/><circle class="tw" cx="560" cy="28" r="1.5"/><circle class="tw" cx="650" cy="64" r="1.5"/><circle class="tw" cx="730" cy="26" r="1.5"/><circle class="tw" cx="500" cy="70" r="1.5"/></g>
<circle cx="690" cy="50" r="22" fill="#ffe9a8"/><circle cx="700" cy="44" r="20" fill="#3a1f4a"/>
<g class="cl" opacity=".35" fill="#c9a0dc"><ellipse cx="0" cy="80" rx="60" ry="10"/><ellipse cx="30" cy="74" rx="40" ry="9"/></g>
<polygon class="beam" points="400,62 250,-40 330,-40" fill="#ffe9a8" opacity=".25"/>
<g fill="#160c22"><polygon points="400,60 388,140 380,140 372,200 428,200 420,140 412,140"/><rect x="368" y="138" width="64" height="6"/><rect x="376" y="96" width="48" height="5"/><rect x="398" y="40" width="4" height="22"/></g>
<g fill="#160c22"><rect x="0" y="170" width="800" height="50"/><rect x="40" y="130" width="60" height="40"/><rect x="120" y="140" width="50" height="30"/><rect x="200" y="120" width="70" height="50"/><rect x="520" y="130" width="70" height="40"/><rect x="620" y="118" width="60" height="52"/><rect x="700" y="140" width="80" height="30"/></g>
<g fill="#ffd966"><rect class="win" x="52" y="140" width="6" height="8"/><rect class="win" x="70" y="150" width="6" height="8"/><rect class="win" x="215" y="132" width="6" height="8"/><rect class="win" x="240" y="146" width="6" height="8"/><rect class="win" x="535" y="142" width="6" height="8"/><rect class="win" x="640" y="130" width="6" height="8"/><rect class="win" x="715" y="150" width="6" height="8"/></g>
<text x="16" y="208" fill="#ffd966" font-family="monospace" font-size="14" letter-spacing="3">PARIS</text>
</svg>
